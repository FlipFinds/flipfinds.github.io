baseURL = "https://flipfinds.net/"
languageCode = "en-us"
title = "FlipFinds"
theme = "PaperMod"
enableRobotsTXT = true
summaryLength = 30

[sitemap]
  changeFreq = "weekly"
  priority = 0.8

[params]
  env = "production"
  description = "FlipFinds helps resellers estimate profit, track inventory, protect margin, and run practical resale workflows."
  keywords = ["flipfinds", "resale profit calculator", "inventory tracking", "reseller workflow", "pricing discipline", "sell-through"]
  mainSections = ["posts"]
  images = ["images/hero-home.png"]
  defaultTheme = "light"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  disableSpecial1stPost = true
  [params.label]
    text = "FlipFinds"
    icon = "images/app-icon.png"
    iconHeight = 44
  [params.assets]
    theme_color = "#0E5739"
    msapplication_TileColor = "#0E5739"
    favicon = "images/app-icon.png"
    favicon16x16 = "images/app-icon.png"
    favicon32x32 = "images/app-icon.png"
    apple_touch_icon = "images/app-icon.png"
  [params.cover]
    hiddenInList = false
    hiddenInSingle = false
  [params.footer]
    text = "Support: support@parasdigital.net"
    hideCopyright = false
  [params.homeInfoParams]
    Title = "FlipFinds for Resellers"
    Content = "Profit calculator, inventory tracking, and practical workflows for sourcing, pricing, and sell-through."
  [params.author]
    name = "FlipFinds Team"
    email = "support@parasdigital.net"
  [params.analytics.google]
    SiteVerificationTag = "8LP8V_IDTUfadYf9D-xqpbdz2dxGU1aGSVPwl5wUYCU"
  [params.analytics.bing]
    SiteVerificationTag = ""
  [params.analytics.yandex]
    SiteVerificationTag = ""
  [params.analytics.plausible]
    domain = ""
    scriptSrc = "https://plausible.io/js/script.js"

[services]
  [services.googleAnalytics]
    ID = "G-XX9ZJKDNEC"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"

[[menu.main]]
  name = "Product"
  url = "/product/"
  weight = 1
[[menu.main]]
  name = "Free tools"
  url = "/tools/"
  weight = 2
[[menu.main]]
  name = "Guides"
  url = "/guides/"
  weight = 3
[[menu.main]]
  name = "Resources"
  url = "/resources/"
  weight = 4
[[menu.main]]
  name = "Get the app"
  url = "/download/"
  weight = 5
