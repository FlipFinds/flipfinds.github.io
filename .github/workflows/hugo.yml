name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.156.0"
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Snapshot existing discovery URLs
        if: github.event_name != 'pull_request'
        run: python3 scripts/indexnow.py snapshot

      - name: Preserve discovery baseline for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-baseline
          path: indexnow-baseline.json

      - name: Validate public pages and calculator measurement
        env:
          SITE_BUILD: public
        run: |
          python3 scripts/validate_site.py public
          for script in assets/js/*.js; do node --check "$script"; done
          node --test tests/*.test.cjs

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout notification script
        uses: actions/checkout@v4

      - name: Load discovery baseline
        uses: actions/download-artifact@v4
        with:
          name: indexnow-baseline

      - name: Notify changed discovery set after deployment
        run: python3 scripts/indexnow.py notify
