{{- if site.Config.Services.GoogleAnalytics.ID }}
<aside style="max-width: var(--main-width); margin: 1rem auto; padding: 1rem; color: var(--primary); background: var(--entry); border: 1px solid var(--border); border-radius: var(--radius);" aria-label="Website analytics preferences">
  <div id="ffAnalyticsChoice">
    <p>Allow Google Analytics to help us understand visits, calculator use, and download clicks? Your calculator amounts are not sent. <a href="/pages/privacy/#website-analytics">Privacy details</a></p>
    <button id="ffAnalyticsAllow" type="button" style="padding: .6rem; text-decoration: underline;">Allow analytics</button>
    <button id="ffAnalyticsDecline" type="button" style="padding: .6rem; text-decoration: underline;">No thanks</button>
  </div>
  <span id="ffAnalyticsStatus">Analytics off</span> · <button id="ffAnalyticsSettings" type="button" style="text-decoration: underline;">Analytics settings</button>
</aside>
{{- end }}
<script>
  (function () {
    var COUNT_API_BASE = "https://countapi.mileshilliard.com/api/v1";
    var STORE_PREFIX = "flipfinds_store_clicks_v2";
    var EVENT_PREFIX = "flipfinds_site_events_v2";

    function trackWebEvent(name, params) {
      if (typeof window.gtag !== "function") return;
      try { window.gtag("event", name, params || {}); } catch (e) {}
    }

    function isoDay() {
      return new Date().toISOString().slice(0, 10);
    }

    function classifyStore(href) {
      if (!href) return null;
      try {
        var u = new URL(href, window.location.origin);
        var host = (u.hostname || "").toLowerCase();
        var path = (u.pathname || "").toLowerCase();
        if (host.indexOf("play.google.com") !== -1 && u.search.indexOf("id=com.flipfinds.app") !== -1) return "play";
        if (host === "apps.apple.com" && path.indexOf("/id6757338338") !== -1) return "appstore";
      } catch (e) {
        return null;
      }
      return null;
    }

    function classifyLandingPageClick(anchor) {
      var href = (anchor && anchor.getAttribute("href")) || "";
      if (!href) return null;
      try {
        var u = new URL(href, window.location.origin);
        var host = (u.hostname || "").toLowerCase();
        if (host !== window.location.hostname.toLowerCase() || u.pathname !== "/") return null;
        var medium = (u.searchParams.get("utm_medium") || "").toLowerCase();
        if (medium === "nav") return "nav";
        if (medium === "start_here") return "start_here";
        if (medium === "post_cta") return "post_cta";
        var tracked = (anchor.getAttribute("data-ff-track") || "").toLowerCase();
        if (tracked.indexOf("post_cta") !== -1) return "post_cta";
        if (tracked.indexOf("start_here") !== -1) return "start_here";
        return "other";
      } catch (e) {
        return null;
      }
    }

    function fireAndForget(url) {
      if (typeof fetch === "function") {
        try {
          fetch(url, { method: "GET", mode: "no-cors", keepalive: true, cache: "no-store" }).catch(function () {});
          return;
        } catch (e) {}
      }
      var img = new Image();
      img.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "r=" + Date.now();
    }

    function hit(prefix, key) {
      if (!key) return;
      fireAndForget(COUNT_API_BASE + "/hit/" + prefix + "_" + key);
    }

    function pathBucket() {
      var p = (window.location.pathname || "/").toLowerCase();
      if (p === "/" || p === "") return "home";
      if (p.indexOf("/pages/start-here/") === 0) return "page_start_here";
      if (p.indexOf("/posts/") === 0) {
        return p === "/posts/" ? "posts_index" : "post_article";
      }
      if (p.indexOf("/guides/") === 0) {
        return p === "/guides/" ? "guides_index" : "guide_article";
      }
      return "other";
    }

    function trackPageViewOncePerLoad() {
      var day = isoDay();
      var bucket = pathBucket();
      hit(EVENT_PREFIX, "page_total_" + day);
      hit(EVENT_PREFIX, "page_" + bucket + "_" + day);
    }

    function inferClickSource(anchor) {
      if (!anchor) return "unknown";
      var explicit = anchor.getAttribute("data-source");
      if (explicit) return explicit;
      var tracked = anchor.getAttribute("data-ff-track");
      if (tracked) return tracked;
      var p = (window.location.pathname || "").toLowerCase();
      if (anchor.closest && anchor.closest(".ff-home-callout")) return "home_callout";
      if (anchor.closest && anchor.closest(".ff-post-next-steps")) return "post_next_steps";
      if (anchor.closest && anchor.closest(".ff-inline-cta")) return "inline_cta";
      if (p.indexOf("/pages/start-here/") === 0) return "start_here_page";
      if (p.indexOf("/guides/") === 0) return "guides_page";
      if (p.indexOf("/posts/") === 0) return "post_page";
      if (p === "/") return "home";
      return "unknown";
    }

    function trackStartHereClick(anchor) {
      var href = (anchor && anchor.getAttribute("href")) || "";
      if (!href) return;
      try {
        var u = new URL(href, window.location.origin);
        if (u.pathname.toLowerCase().indexOf("/pages/start-here/") !== 0) return;
      } catch (e) {
        return;
      }
      var day = isoDay();
      var source = inferClickSource(anchor);
      hit(EVENT_PREFIX, "start_here_click_total_" + day);
      hit(EVENT_PREFIX, "start_here_click_" + source + "_" + day);
    }

    document.addEventListener("click", function (evt) {
      var anchor = evt.target && evt.target.closest ? evt.target.closest("a[href]") : null;
      if (!anchor) return;
      trackStartHereClick(anchor);
      var landingSource = classifyLandingPageClick(anchor);
      if (landingSource) {
        var day = isoDay();
        hit(EVENT_PREFIX, "landing_click_total_" + day);
        hit(EVENT_PREFIX, "landing_click_" + landingSource + "_" + day);
      }
      var store = classifyStore(anchor.getAttribute("href"));
      if (!store) return;

      var day = isoDay();
      var source = inferClickSource(anchor);
      trackWebEvent(store === "appstore" ? "ios_app_store_cta_clicked" : "android_play_store_cta_clicked", {
        cta_source: source
      });
      hit(STORE_PREFIX, "total_" + day);
      hit(STORE_PREFIX, store + "_" + day);
      hit(EVENT_PREFIX, "store_click_total_" + day);
      hit(EVENT_PREFIX, "store_click_" + source + "_" + day);
      hit(EVENT_PREFIX, "store_click_" + source + "_" + store + "_" + day);
    });

    trackPageViewOncePerLoad();
  })();
</script>
<script>
  (function () {
    function initLandingShowcase() {
      var mainShot = document.getElementById("ffLandingMainShot");
      var caption = document.getElementById("ffLandingCaption");
      var thumbs = Array.prototype.slice.call(document.querySelectorAll("[data-ff-landing-shot]"));
      if (!mainShot || !caption || !thumbs.length) return;

      thumbs.forEach(function (thumb) {
        thumb.addEventListener("click", function () {
          var shot = thumb.getAttribute("data-ff-landing-shot");
          var cap = thumb.getAttribute("data-ff-landing-cap") || "";
          if (shot) {
            mainShot.setAttribute("src", shot);
          }
          caption.textContent = cap;
          thumbs.forEach(function (other) {
            other.classList.remove("is-active");
          });
          thumb.classList.add("is-active");
        });
      });
    }

    function initHeroCarousel(root) {
      var slides = Array.prototype.slice.call(root.querySelectorAll("[data-ff-hero-slide]"));
      var dots = Array.prototype.slice.call(root.querySelectorAll("[data-ff-hero-dot]"));
      var titleEl = root.querySelector("[data-ff-hero-title]");
      var captionEl = root.querySelector("[data-ff-hero-caption]");
      var prevBtn = root.querySelector("[data-ff-hero-prev]");
      var nextBtn = root.querySelector("[data-ff-hero-next]");
      if (!slides.length) return;

      var index = slides.findIndex(function (s) { return s.classList.contains("is-active"); });
      if (index < 0) index = 0;

      function render() {
        slides.forEach(function (slide, i) {
          var active = i === index;
          slide.classList.toggle("is-active", active);
        });
        dots.forEach(function (dot, i) {
          var active = i === index;
          dot.classList.toggle("is-active", active);
          dot.setAttribute("aria-selected", active ? "true" : "false");
        });
        if (titleEl) titleEl.textContent = slides[index].getAttribute("data-title") || "";
        if (captionEl) captionEl.textContent = slides[index].getAttribute("data-caption") || "";
      }

      if (prevBtn) {
        prevBtn.addEventListener("click", function () {
          index = (index - 1 + slides.length) % slides.length;
          render();
        });
      }
      if (nextBtn) {
        nextBtn.addEventListener("click", function () {
          index = (index + 1) % slides.length;
          render();
        });
      }
      dots.forEach(function (dot) {
        dot.addEventListener("click", function () {
          var v = Number(dot.getAttribute("data-ff-hero-dot"));
          if (!Number.isNaN(v) && v >= 0 && v < slides.length) {
            index = v;
            render();
          }
        });
      });

      render();
    }

    document.addEventListener("DOMContentLoaded", function () {
      initLandingShowcase();
      document.querySelectorAll("[data-ff-hero-carousel]").forEach(function (carousel) {
        var root = carousel.closest(".ff-hero-proof");
        if (root) initHeroCarousel(root);
      });
    });
  })();
</script>
